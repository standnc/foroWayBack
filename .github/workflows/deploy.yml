name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          # Añadir el VPS a los hosts conocidos para evitar bloqueos
          mkdir -p ~/.ssh
          ssh-keyscan -H 172.239.238.6 >> ~/.ssh/known_hosts
          
          # Ejecutar el script de despliegue en el VPS
          ssh -o StrictHostKeyChecking=no admin@172.239.238.6 "cd /var/www/foroWayBack && ./deploy.sh"
