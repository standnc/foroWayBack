name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 172.239.238.6 >> ~/.ssh/known_hosts
          
          # 1. Sincronizar código en VPS (para asegurar que deploy.sh existe)
          # 2. Ejecutar deploy.sh (pip install, migrate, collectstatic, restart gunicorn)
          ssh -o StrictHostKeyChecking=no admin@172.239.238.6 "
            cd /var/www/foroWayBack &&
            git fetch origin &&
            git reset --hard origin/master &&
            git clean -fd -e .env -e .venv/ &&
            chmod +x deploy.sh &&
            ./deploy.sh
          "
