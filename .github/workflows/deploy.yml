name: CI + Deploy to VPS

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    # En el runner no hay .env; sin esto, el gate de SECRET_KEY con DEBUG=False
    # (config/settings.py) impide siquiera importar los settings.
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-real-key-4f8a2b1e9d7c3a6501fe82b4d09c7a3e5b71d2
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Django deploy check
        env:
          DEBUG: "False"
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'ci-only-not-a-real-key-4f8a2b1e9d7c3a6501fe82b4d09c7a3e5b71d2' }}
          ALLOWED_HOSTS: "localhost"
        run: python manage.py check --deploy --fail-level ERROR

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 172.239.238.6 >> ~/.ssh/known_hosts

          # El fetch/reset/clean lo hace ya deploy.sh; aquí solo se traía para
          # asegurar que el propio script existe antes de ejecutarlo.
          ssh admin@172.239.238.6 "
            cd /var/www/foroWayBack &&
            git fetch origin &&
            git reset --hard origin/master &&
            chmod +x deploy.sh &&
            ./deploy.sh
          "
