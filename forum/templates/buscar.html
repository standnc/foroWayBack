{% extends "base.html" %}
{% block title %}Buscar — Foro Retro BoomBang{% endblock %}

{% block content %}
<h1 class="font-display text-2xl font-bold text-white mb-6">🔍 Buscar</h1>

<form class="mb-8" method="get" action="{% url 'forum:buscar' %}">
  <div class="flex gap-3">
    <input type="search" name="q" value="{{ request.GET.q|default:'' }}"
           placeholder="Buscar hilos, posts, usuarios…"
           class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-boom/50 focus:border-boom transition-colors">
    <button type="submit" class="px-6 py-3 bg-boom text-slate-900 font-semibold rounded-xl hover:bg-boom-400 transition-colors">
      Buscar
    </button>
  </div>
</form>

<div class="text-center text-slate-500 py-12">
  <p class="text-lg mb-2">🏝️</p>
  <p>Próximamente: búsqueda en todos los hilos y posts del foro.</p>
</div>
{% endblock %}
