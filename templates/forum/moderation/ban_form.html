{% extends "base.html" %}
{% block title %}Nuevo Baneo — BoomBang Foro{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 py-8">
  <a href="{% url 'forum:moderation_panel' %}" class="text-boom hover:underline text-sm mb-4 inline-block">&larr; Volver al panel</a>
  <h1 class="text-2xl font-bold text-white font-display mb-6">Nuevo Baneo</h1>

  <form method="post" class="bg-slate-800 rounded-xl p-6 border border-slate-700">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-300 mb-2">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="w-full px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg transition-colors font-medium">Aplicar Baneo</button>
  </form>
</div>
{% endblock %}
